<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tapa</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <main class="board-area">
        <header class="header">
          <div class="title-row">
            <h1 id="title">Tapa</h1>
            <label class="lang">
              <select id="lang" aria-label="Language"></select>
            </label>
          </div>
          <p id="intro" class="intro" data-i18n="intro"></p>
          <p id="status" class="status"></p>
        </header>

        <div id="stage" class="stage">
          <canvas id="board" width="10" height="10"></canvas>
        </div>

        <footer class="footer">
          <p class="hint" data-i18n="hint.mouse"></p>
          <p class="hint" data-i18n="hint.keys"></p>
          <p class="hint" data-i18n="hint.touch"></p>
          <p id="info" class="info"></p>
          <p id="stats" class="stats"></p>
        </footer>
      </main>

      <aside class="panel">
        <h2 class="panel-title" data-i18n="panel.controls"></h2>
        <div class="buttons">
          <button id="btn-new" type="button">
            <span data-i18n="btn.new"></span><kbd>N</kbd>
          </button>
          <button id="btn-clear" type="button">
            <span data-i18n="btn.clear"></span><kbd>R</kbd>
          </button>
          <button id="btn-check" type="button">
            <span data-i18n="btn.check"></span><kbd>C</kbd>
          </button>
          <button id="btn-solution" type="button">
            <span data-i18n="btn.solution"></span><kbd>S</kbd>
          </button>
          <button id="btn-onestep" type="button">
            <span data-i18n="btn.onestep"></span><kbd>D</kbd>
          </button>
          <button id="btn-cluestep" type="button">
            <span data-i18n="btn.cluestep"></span>
          </button>
          <button id="btn-undo" type="button">
            <span data-i18n="btn.undo"></span><kbd>Z</kbd>
          </button>
        </div>

        <h2 class="panel-title" data-i18n="panel.generation"></h2>
        <div id="fields" class="fields"></div>
        <div class="buttons row">
          <button id="btn-apply" type="button"><span data-i18n="btn.apply"></span></button>
          <button id="btn-defaults" type="button"><span data-i18n="btn.defaults"></span></button>
        </div>
        <p id="help" class="help"></p>
        <p id="message" class="message"></p>

        <h2 class="panel-title" data-i18n="panel.batch"></h2>
        <div class="buttons row">
          <button id="btn-print" type="button"><span data-i18n="btn.print"></span></button>
          <button id="btn-bench" type="button"><span data-i18n="btn.bench"></span></button>
        </div>
        <p class="help" data-i18n="batch.help"></p>
      </aside>
    </div>

    <section id="output-wrap" class="output-wrap" hidden>
      <div class="output-head">
        <span id="output-title">Output</span>
        <button id="btn-output-close" type="button">
          <span data-i18n="output.close"></span>
        </button>
      </div>
      <pre id="output"></pre>
    </section>

    <script src="i18n.js"></script>
    <script src="app.js"></script>
  </body>
</html>
