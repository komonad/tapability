[package]
name = "tapa"
version = "0.1.0"
edition = "2021"
description = "A 20x20 Tapa puzzle game with a built-in solver and unique-solution generator"

[dependencies]
winapi = { version = "0.3.9", features = [
    "winuser",
    "wingdi",
    "libloaderapi",
    "minwindef",
    "windef",
    "errhandlingapi",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1


