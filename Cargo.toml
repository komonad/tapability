[package]
name = "tapa"
version = "0.1.0"
edition = "2021"
description = "A Tapa puzzle game with a built-in solver and unique-solution generator"

[workspace]
members = ["core", "wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[dependencies]
tapa-core = { path = "core" }
winapi = { version = "0.3.9", features = [
    "winuser",
    "wingdi",
    "libloaderapi",
    "minwindef",
    "windef",
    "errhandlingapi",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# The browser build trades a little speed for a much smaller download.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
panic = "abort"
